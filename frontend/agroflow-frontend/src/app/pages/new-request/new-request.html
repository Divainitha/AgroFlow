<div class="request-page">

  <div class="page-header">
    <div>
      <p class="eyebrow">APPROVAL WORKFLOW</p>
      <h1>New Request</h1>
      <p class="subtitle">
        Create a new request and submit it for approval.
      </p>
    </div>
  </div>

  <div class="form-card">

    <div class="section-title">
      <h2>Request Information</h2>
      <p>Provide the basic information for your request.</p>
    </div>

    <form [formGroup]="requestForm" (ngSubmit)="submitRequest()">

      <div class="form-grid">

        <div class="form-group">
          <label for="requestType">Request Type</label>

          <select id="requestType" formControlName="requestType">
            <option value="">Select request type</option>
            <option value="procurement">Procurement</option>
            <option value="finance">Finance</option>
            <option value="hr">HR</option>
            <option value="transport">Transport</option>
            <option value="project">Project</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>

          <select id="priority" formControlName="priority">
            <option value="">Select priority</option>
            <option value="low">Low</option>
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="title">Request Title</label>

          <input
            id="title"
            type="text"
            formControlName="title"
            placeholder="Enter a short title for the request"
           />
        </div>

        <div class="form-group full-width">
          <label for="description">Description</label>

          <textarea
            id="description"
            rows="5"
            formControlName="description"
            placeholder="Describe the request and provide any relevant details"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="amount">Estimated Amount</label>

          <input
                id="amount"
                type="number"
                formControlName="amount"
                placeholder="0.00"
            />
        </div>

        <div class="form-group">
          <label for="department">Department</label>

          <select id="department" formControlName="department">
            <option value="">Select department</option>
            <option value="finance">Finance</option>
            <option value="hr">Human Resources</option>
            <option value="it">Information Technology</option>
            <option value="operations">Operations</option>
            <option value="procurement">Procurement</option>
          </select>
        </div>

      </div>

      <div class="approval-info">

        <div class="info-icon">i</div>

        <div>
          <strong>Approval Workflow</strong>

          <p>
            After submission, this request will be reviewed by the
            appropriate approvers according to the approval workflow.
          </p>
        </div>

      </div>

      <div class="form-actions">

        <button
            type="button"
            class="cancel-button"
            (click)="cancelRequest()">
            Cancel
        </button>

        <button
          type="submit"
          class="submit-button">
          Submit Request
        </button>

      </div>

    </form>

  </div>

</div>
